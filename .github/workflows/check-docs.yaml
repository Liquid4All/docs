name: Check docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mintlify-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Mintlify CLI
        run: npm install --global mint@4.3.51
      - name: Check publication exclusions
        run: |
          node --test scripts/checkPublishedContent.test.mjs
          node scripts/checkPublishedContent.mjs
      - name: Validate all MDX pages and navigation
        run: mint validate
      - name: Check internal documentation links
        run: mint broken-links

  check-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        # use <!-- markdown-link-check-disable-next-line --> to skip next line
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          config-file: ./link-check.json
          base-branch: ${{ github.base_ref }}
