name: Preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  HUSKY: 0
  CI: 1

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mintlify preview deployment
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          SUBDOMAIN=liquidai-$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/^-+\|-+$//g')

          curl --request POST \
            --url https://api.mintlify.com/v1/deployment \
            --header 'Authorization: Bearer ${{ secrets.MINTLIFY_API_TOKEN }}' \
            --header 'Content-Type: application/json' \
            --data "{
              \"subdomain\": \"${SUBDOMAIN}\",
              \"gitBranch\": \"${BRANCH_NAME}\"
            }"
