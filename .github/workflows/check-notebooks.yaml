name: Check notebooks

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'scripts/**'
      - 'snippets/quickstart/**'
      - '.github/workflows/check-notebooks.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'scripts/**'
      - 'snippets/quickstart/**'
      - '.github/workflows/check-notebooks.yaml'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebooks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run ruff linter
        run: |
          echo "🔍 Running Ruff linter on notebooks..."
          uv run nbqa ruff . --output-format=github
          echo ""
          echo "✅ Ruff checks passed!"

      - name: Run mypy type check
        run: |
          echo ""
          echo "🔍 Running mypy type checker on notebooks..."
          uv run nbqa mypy .
          echo "✅ Mypy type checks passed!"

      - name: Check snippet freshness
        working-directory: .
        run: |
          echo "🔍 Checking that generated snippets match notebook source..."
          python3 scripts/generate_snippets.py --check
          echo "✅ Snippets are up to date!"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "✅ All required checks passed!"
          echo "📊 Validated $(find . -name '*.ipynb' | wc -l) notebooks"

  discover-notebooks:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List notebooks
        id: list
        run: |
          notebooks=$(ls notebooks/*.ipynb | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"
          echo "Found notebooks: $notebooks"

  run-notebooks:
    needs: discover-notebooks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.discover-notebooks.outputs.notebooks) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install modal
        run: uv pip install --system modal

      - name: Set up Modal token
        run: modal token set --token-id ${{ secrets.MODAL_TOKEN_ID }} --token-secret ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Run notebook on Modal
        run: python util/run_notebook_test.py --notebook "notebooks/${{ matrix.notebook }}" --skip-packages flash-attn